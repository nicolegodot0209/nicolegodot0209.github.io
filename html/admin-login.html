<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyMHS</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="https://kit.fontawesome.com/1a99a24fea.js" crossorigin="anonymous"></script>
</head>
  
  <body>
    <section id="sign_in_cont">
        <div class="sign-in">
            <div class="text">
                <span>
                    <h6>Welcome to MyMHS</h6>
                    <img src="/images/logo.png">
                </span>
                <h1>Sign In</h1>
            </div>
            
            <form id="login_form" class="login-form">
                <div class="input-cont">
                    <input type="text" id="login_email" placeholder="Email address..." required>
                    <input type="password" id="login_password" placeholder="Password..." required>
                </div>
                <div class="checkbox-cont">
                    <input type="checkbox" id="remember_me" value="yes">
                    <label for="remember_me">Remember me?</label>
                </div>
                <button id="sign_in" class="standard-button" type="submit">Sign In</button>
                <button id="google_sign_in" class="standard-button" type="button"><img src="/images/g-logo.png">Sign In with Google</button>
                <p id="status" role="status"></p>
            </form>
        </div>
        <a href="../index.html">Return to Home Page</a>
    </section>

    <section id="event_submit_cont">
       
    </section>


  <script type="module" src="/js/admin.js"></script>
  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/login.js"></script>
  </body>
</html>

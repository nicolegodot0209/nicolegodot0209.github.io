<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MyMHS</title>
        <link rel="stylesheet" href="/css/base.css">
        <link rel="stylesheet" href="/css/admin.css">
        <script src="https://kit.fontawesome.com/1a99a24fea.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <div class="tab-buttons">
            <button id="calendar_button" class="tab-button"><i class="fa-solid fa-calendar"></i></button>
            <button id="announcements_button" class="tab-button"><i class="fa-solid fa-bullhorn"></i></button>
        </div>

        <template id="event_template">
            <div class="event-cont">
                <div class="event">
                    <button>
                        <div class="event-title">
                            <input class="event-title-text edit" placeholder="Title..." disabled>
                            <div class="icon-cont"><i class="fa-solid fa-people-group"></i></div>

                            <select name="event-type" class="event-type edit">
                                <option value="academic">Academic</option>
                                <option value="club">Club</option>
                                <option value="sport">Sport</option>
                                <option value="social">Social</option>
                            </select>
                        </div>
                        <div class="event-details">
                            <input class="event-time edit" type="time" disabled>•
                            <input class="event-location edit" placeholder="Location..." disabled>
                        </div>
                    </button>

                    <textarea class="event-desc edit" rows="1" placeholder="Description..." disabled></textarea>
                </div>

                <div class="mod-buttons">
                    <button class="delete-button"><i class="fa-solid fa-trash"></i></button>
                    <button class="edit-button"><i class="fa-solid fa-pen"></i></button>
                    <button class="confirm-button"><i class="fa-solid fa-check"></i></button>
                    <button class="exit-button"><i class="fa-solid fa-x"></i></button>
                </div>
            </div>
        </template>

        <section id="calendar_section" class="section calendar-section">
            <input type="date" id="date_input">
            <div class="cont">
                <div class="events" id="events"></div>
                <button id="add_event" class="add-event"><i class="fa-solid fa-plus"></i></button>
            </div>
        </section>

        <section id="announcements_section" class="section announcement-section">
            <h1>Announcements</h1>
        </section>

        <script src="/js/admin.js" type="module"></script>
    </body>
</html>
